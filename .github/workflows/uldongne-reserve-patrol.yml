name: 울동네 통합 자동 순찰대

on:
  # 자동 시간표(schedule)는 해외 서버 차단 문제로 해제하고,
  # 한국 인터넷(회사·집 컴퓨터 Windows 작업 스케줄러 평일 11:10 / 17:10)으로 완전 이전함.
  workflow_dispatch:
    inputs:
      sigungu:
        description: '특정 시·군·구만 점검할 경우 입력 (비워두면 전체 340곳 통합 순찰)'
        required: false
        default: ''
      finalize_blog:
        description: '블로그 초안 마무리까지 강제 실행 (true/false, 비워두면 새벽 회차 자동 판단)'
        required: false
        default: ''

jobs:
  full-patrol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 울동네/worker
    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 울동네/worker/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 울동네 통합 순찰 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOV24_API_KEY: ${{ secrets.GOV24_API_KEY }}
          WELFARE_API_KEY: ${{ secrets.WELFARE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.sigungu }}" ]; then
            ARGS="$ARGS --sigungu=${{ github.event.inputs.sigungu }}"
          fi
          if [ "${{ github.event.inputs.finalize_blog }}" = "true" ]; then
            ARGS="$ARGS --finalize-blog"
          elif [ "${{ github.event.inputs.finalize_blog }}" = "false" ]; then
            ARGS="$ARGS --no-finalize-blog"
          fi
          npm run full-patrol -- $ARGS
