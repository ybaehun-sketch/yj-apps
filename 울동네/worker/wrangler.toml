name = "uldongne-patrol-worker"
main = "src/index.ts"
compatibility_date = "2025-02-14"

# [triggers]
# 정기 전체 순찰은 GitHub Actions(.github/workflows/uldongne-reserve-patrol.yml)로 통합 이전됨.
# (Cloudflare Worker는 관리자 화면 수동 재점검 등 HTTP 요청 용도로만 유지)
# crons = ["0 20 * * 1-5", "0 3 * * 1-5", "0 9 * * 1-5"]

[vars]
GEMINI_SCAN_MODEL = "gemini-3.5-flash-lite"
GEMINI_WRITE_MODEL = "gemini-3.8-flash"
AUTO_PUBLISH_ENABLED = "true"
APP_AUTO_PUBLISH_MIN_CONFIDENCE = "85"
MAX_BLOG_DRAFTS_PER_DAY = "3"
MAX_TARGETS_PER_RUN = "12"
MAX_NEW_POSTS_PER_TARGET = "5"
PATROL_RELAY_DELAY_MS = "2000"
PATROL_MAX_BATCHES = "35"

# Secrets (배포 시 `wrangler secret put <NAME>` 으로 등록)
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - GEMINI_API_KEY
# - GOV24_API_KEY (공공데이터포털 보조금24 인증키)
# - WORKER_ADMIN_SECRET (수동 테스트 /run 및 50곳 이어달리기 호출용 비밀키)
# - WORKER_PUBLIC_URL (배포된 Worker 주소: 이어달리기 자동 호출 시 사용)
# - BACKUP_LLM_API_KEY (추후 타사 AI 백업 연결 시 등록: openai / anthropic 등)
# - BACKUP_LLM_PROVIDER / BACKUP_LLM_MODEL / BACKUP_LLM_BASE_URL (선택 사항)
